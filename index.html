<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a dark stage bar outside the product holds the view-as switch; below it a rail + canvas + side-panel assistant frame. */
  --ink:#1a2226;
  --ink-2:#4b585f;
  --ink-3:#7a878e;
  --line:#e5e8ea;
  --line-2:#d3d9dc;
  --bg:#ffffff;
  --rail:#f4f5f5;
  --hover:#e8ebec;
  --accent:#0b6e69;
  --accent-soft:#e2f1ef;
  --warn:#9a5a06;
  --warn-soft:#fbf0dc;
  --ok:#1d7448;
  --ok-soft:#e0f2e8;
  --crit:#b3261e;
  --crit-soft:#fbe6e4;
  --lock:#eceff0;
  --stage:#16212a;
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--stage);display:flex;flex-direction:column;font-size:14px;line-height:1.45}
button{font-family:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}
.i.flip{transform:rotate(180deg)}

/* stage bar (outside the product) */
.stage{display:flex;align-items:center;gap:14px 20px;padding:8px 16px;background:var(--stage);color:#e8eef0;flex-wrap:wrap}
.stage .t{font-weight:600;font-size:13px}
.stage .sub{color:#8fa1a9;font-size:12px}
.seg{display:flex;gap:4px;background:#222f39;border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#b9c6cb;padding:5px 10px 5px 6px;border-radius:9px;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left}
.seg button b{display:block;font-weight:600;line-height:1.1}
.seg button small{display:block;color:#8fa1a9;font-size:11px;line-height:1.2}
.seg button.on{background:#f4f6f5;color:#10181c}
.seg button.on small{color:#5d6b72}
.stage .grow{flex:1}
.sbtn{border:1px solid #33434e;background:transparent;color:#d5dfe3;border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.sbtn:hover{background:#222f39}
.sbtn.on{background:#1f4b49;border-color:#2d6b68;color:#fff}

/* product frame */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px 1fr;background:var(--bg);margin:0 8px;border-radius:12px 12px 0 0;overflow:hidden;position:relative}
.app.p-open{grid-template-columns:248px 1fr 470px}
.rail{background:var(--rail);padding:14px 10px 12px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
.rail .top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px 8px}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:-.01em;font-size:15px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.logo i:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.rail .tools{display:flex;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;border:0;background:none;font-size:14.5px;text-align:left;width:100%;position:relative}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--hover);font-weight:600}
.nav .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.sub{font-size:14px;color:var(--ink)}
.nav .dotnew{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.lbl{color:var(--ink-3);font-size:12.5px;padding:14px 10px 4px}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:14.5px}

.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;min-height:52px;gap:12px}
.crumb{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15px}
.hr{display:flex;align-items:center;gap:8px}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:780px;margin:0 auto;padding:6px 28px 28px}
.col.wide{max-width:980px}
.homewrap{max-width:780px;margin:0 auto;padding:11vh 28px 40px}
.homewrap h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0 0 22px;text-wrap:balance}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.lead{color:var(--ink-2);margin:0 0 16px}
.dock{padding:6px 28px 18px;max-width:836px;width:100%;margin:0 auto}

/* composer */
.comp{border:1px solid var(--line-2);border-radius:20px;padding:14px 16px 10px;background:#fff;box-shadow:0 1px 2px rgba(20,32,38,.05);position:relative}
.comp textarea{width:100%;border:0;outline:0;resize:none;font:inherit;font-size:15.5px;min-height:26px;max-height:160px;background:transparent;color:var(--ink);padding:0;display:block}
.comp .tl{display:flex;align-items:center;gap:4px;margin-top:8px}
.tbtn{border:0;background:none;padding:6px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;position:relative}
.tbtn:hover{background:var(--hover)}
.mode{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:14px;border:0;background:none;cursor:pointer}
.mode:hover{background:var(--hover)}
.mode.handoff{background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:default}
.mode.handoff button{border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--accent)}
.sendb{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
.sendb:hover{background:#095a56}
.scopednote{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px;padding:0 4px}
.slash{position:absolute;left:12px;top:calc(100% + 6px);background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(20,32,38,.12);z-index:10;width:340px}
.slash.up{top:auto;bottom:calc(100% + 6px)}
.slash[hidden]{display:none}
.sitem{display:flex;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:9px;width:100%;text-align:left;cursor:pointer}
.sitem:hover{background:var(--hover)}
.sitem small{display:block;color:var(--ink-3);font-size:12.5px}
.sitem.dis{opacity:.55}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chipb{display:inline-flex;gap:8px;align-items:center;padding:10px 16px;border-radius:14px;background:#f2f4f4;border:1px solid transparent;cursor:pointer;font-size:14.5px}
.chipb:hover{background:var(--hover)}
.chipb.hand{background:var(--accent-soft);border-color:#b7dbd6;color:#07514d;font-weight:600}
.chipb.dis{opacity:.5;cursor:default}
.newtag{font-size:10.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:99px;font-weight:600}
.modenote{margin-top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.modenote .info{color:var(--ink-2);font-size:13.5px;display:flex;gap:8px;align-items:center}
.suggest{border:1px dashed #8cc3bd;background:#f3faf9;border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left;font-size:14.5px;color:#07514d;line-height:1.4}
.suggest:hover{background:var(--accent-soft)}
.try{margin-top:16px;color:var(--ink-2);font-size:13.5px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:20px}
.ubub{align-self:flex-end;background:#f2f4f4;border-radius:22px;padding:13px 20px;max-width:82%;font-size:15px;line-height:1.5}
.swork{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:15px;cursor:pointer;background:none;border:0;padding:2px 0}
.sgroup h5{font-size:14.5px;font-weight:600;margin:16px 0 8px}
.qpill{display:inline-flex;gap:8px;align-items:center;background:#f2f4f4;border-radius:12px;padding:7px 12px;font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src{display:inline-flex;align-items:center;gap:8px;background:#f2f4f4;border-radius:12px;padding:6px 12px 6px 8px;font-size:13px;border:0;cursor:pointer;max-width:100%;text-align:left}
button.src:hover{background:var(--hover)}
.src.more{padding:6px 12px;cursor:default}
.src.locked{background:var(--lock);color:var(--ink-2);cursor:default}
.src.good{background:var(--ok-soft);color:var(--ok);cursor:default}
.ico{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;background:#6b7c85}
.ico[data-t=call]{background:#6d4cc2}.ico[data-t=mail]{background:#c2453a}.ico[data-t=sheet]{background:#238a52}.ico[data-t=ticket]{background:#2f6db5}.ico[data-t=doc]{background:#3b82c4}.ico[data-t=crm]{background:#b9791d}.ico[data-t=chat]{background:#7a4fb0}.ico[data-t=notes]{background:#0f7a74}.ico[data-t=note]{background:#0b6e69}
.src.locked .ico{background:#8d99a0}
.working{display:flex;gap:8px;align-items:center;color:var(--ink-2);margin-top:14px}
.dots{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dots{animation:none}}
.prose{font-size:15.5px;line-height:1.62}
.prose p{margin:0 0 12px}
.acts{display:flex;gap:4px;margin-top:10px;align-items:center}
.ibtn{border:0;background:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.ibtn:hover{background:var(--hover)}
.ibtn.hl{background:var(--accent-soft);color:var(--accent);width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:600}

/* buttons, tags, people */
.btn{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:7px 13px;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#f5f7f7}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#095a56}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.dng{color:var(--crit);border-color:#e6bcb8}
.btn.dng:hover{background:var(--crit-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:#9fd0c9;color:var(--accent);font-weight:600}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#f0f2f2;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.lock{background:var(--lock)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.person{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:#f2f4f4;border-radius:99px;padding:3px 10px 3px 3px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:var(--c,#6b7c85);flex:none}
.av.lg{width:32px;height:32px;font-size:12px}
.stage .av{width:26px;height:26px;font-size:10px}

/* cards */
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:12px}
.card.kept{border-color:#a4d2cc;box-shadow:inset 3px 0 0 var(--accent)}
.card.locked{background:#f7f8f8;border-style:dashed}
.card.removed{background:#fafbfb;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.card.done{border-color:#9bd0b3;box-shadow:inset 3px 0 0 var(--ok)}
.card.pending{border-color:#e2c58e;box-shadow:inset 3px 0 0 #d9a441}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chead h4{margin:0;font-size:15.5px;font-weight:600;text-wrap:balance}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.sec{margin-top:10px}
.sec .k{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:3px}
.sec p{margin:0;font-size:14px;line-height:1.5}
.confline{margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.cbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ed{width:100%;font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;resize:vertical;outline:0}
.ed:focus{border-color:var(--accent)}
.callout{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:13.5px;background:#f2f4f4}
.callout.ok{background:var(--ok-soft);color:#14542f}
.callout.warn{background:var(--warn-soft);color:#6e4104}
.callout.acc{background:var(--accent-soft);color:#07514d}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:#07514d;border-radius:12px;padding:12px 14px;margin:12px 0 14px;font-size:13.5px}
.banner b{font-weight:600}
.banner.crit{background:var(--crit-soft);color:#7d1b15}
.banner.warn{background:var(--warn-soft);color:#6e4104}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;max-width:180px}
.bar i{display:block;height:100%;background:var(--ok)}
.prog{display:flex;gap:10px;align-items:center;margin:4px 0 14px;color:var(--ink-2);font-size:13px}
.qa{margin-top:10px;display:flex;flex-direction:column;gap:14px}
.qa .ans{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qa .ans p{margin:0 0 8px;font-size:14.5px;line-height:1.55}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sug{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.sug:hover{background:#f5f7f7}

/* side panel */
.panel{display:none;flex-direction:column;border-left:1px solid var(--line);background:#fff;min-height:0}
.p-open .panel{display:flex}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.phead .ttl{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.pbody{flex:1;overflow:auto;padding:14px 16px}
.pfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff}
.pfoot .hint{font-size:12.5px;color:var(--ink-2)}
.recip{display:flex;gap:12px;align-items:center;background:#f6f8f8;border-radius:12px;padding:10px 12px}
.recip small{display:block;color:var(--ink-2);font-size:12.5px}
.psum{margin:12px 0 4px;font-size:13px;color:var(--ink-2)}
.psec{font-size:14px;font-weight:600;margin:18px 0 8px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.note .nh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:13px}
.note label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer}

/* tables, admin */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.rw{cursor:pointer}
.tbl tr.rw:hover td{background:#f7f9f9}
.tblwrap{overflow-x:auto}
.kill{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 18px}
.kill p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.sw{width:44px;height:26px;border-radius:99px;border:0;background:#c5ced2;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on:after{left:21px}
.frow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
select{font:inherit;font-size:13.5px;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;background:#fff}
.drawer{position:absolute;right:0;top:0;bottom:0;width:430px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(20,32,38,.1);z-index:30;display:flex;flex-direction:column}
.drawer .db{flex:1;overflow:auto;padding:14px 18px}
.tl2{list-style:none;margin:10px 0 0;padding:0}
.tl2 li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl2 time{color:var(--ink-3);font-size:12px}
.tl2 b{font-weight:600}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat div{border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{color:var(--ink-2);font-size:12.5px}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(18,26,30,.42);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;width:min(480px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:600}
.modal ul{margin:10px 0 14px;padding-left:18px;color:var(--ink-2);font-size:14px}
.modal li{margin:4px 0}
.mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bellwrap{position:relative}
.bdot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--crit);border:2px solid #fff}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:340px;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:0 10px 30px rgba(20,32,38,.14);z-index:20;padding:6px}
.pop .it{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer}
.pop .it:hover{background:var(--hover)}
.pop .it small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.pop .empty{padding:14px;color:var(--ink-3);font-size:13.5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
#coach{position:fixed;z-index:90;width:268px;background:#16212a;color:#f1f5f6;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#coach[hidden]{display:none}
#coach:before{content:"";position:absolute;left:var(--ax,40px);width:12px;height:12px;background:#16212a;transform:rotate(45deg);top:-6px}
#coach.above:before{top:auto;bottom:-6px}
#coach button{margin-top:8px;border:1px solid #3a4c58;background:transparent;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.coach-target{outline:2px solid #1aa59c !important;outline-offset:2px;border-radius:10px;box-shadow:0 0 0 6px rgba(26,165,156,.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #1aa59c;outline-offset:2px}

@media (max-width:900px){
  .app,.app.p-open{grid-template-columns:60px 1fr}
  .rail .tx,.rail .lbl,.rail .logo span,.rail .tools,.badge{display:none}
  .p-open .panel{position:absolute;right:0;top:0;bottom:0;width:min(470px,100%);z-index:25;box-shadow:-10px 0 30px rgba(20,32,38,.15)}

/* ---------- actions ---------- */
function act(a,arg,el){
 var p=S.persona,it;
 switch(a){
  case 'na':toast('Not part of this prototype.');break;
  case 'persona':S.persona=arg;S.bell=false;S.modal=null;render();break;
  case 'tour':S.tour=!S.tour;render();break;
  case 'reset':reset();break;
  case 'coach-next':var st=curStep();if(st&&st.flag){S.flags[st.flag]=true}render();break;
  case 'nav':S.ui[p].screen=arg;S.bell=false;S.drawer=null;render();break;
  case 'chip-handoff':if(S.paused){toast('Handoff is paused by an admin.');break}setMode(true);break;
  case 'mode-off':S.mode[p]=false;S.focus=true;render();break;
  case 'slash-handoff':S.text[p]='';if(S.paused){toast('Handoff is paused by an admin.');render();break}setMode(true);break;
  case 'start-handoff':if(S.paused){toast('Handoff is paused by an admin.');break}setMode(true);break;
  case 'suggest':S.text.maya=SUGGEST;S.focus=true;render();break;
  case 'send':submit();break;
  case 'toggle-sw':S.showWork=!S.showWork;if(S.showWork&&S.draft.status==='ready')S.flags.swOk=true;render();break;
  case 'toggle-panel':S.panel=!S.panel;render();break;
  case 'close-panel':S.panel=false;render();break;
  case 'open-chat':S.ui.maya.screen='chat';render();break;
  case 'open-detail':S.ui.maya.screen='detail';render();break;
  case 'keep':it=findItem(arg);it.decision='keep';it.editing=false;render();break;
  case 'remove':it=findItem(arg);it.decision='removed';it.editing=false;render();break;
  case 'undo':it=findItem(arg);it.decision=null;render();break;
  case 'edit':findItem(arg).editing=true;render();break;
  case 'cancel-edit':findItem(arg).editing=false;render();break;
  case 'save-edit':it=findItem(arg);var w=document.getElementById('ew-'+arg),g=document.getElementById('eg-'+arg);if(w)it.why=w.value.trim()||it.why;if(g)it.callouts=g.value.trim()||it.callouts;it.edited=true;it.editing=false;it.decision='keep';render();break;
  case 'req-access-sender':it=findItem(arg);it.access=!it.access;if(it.access){L('Maya Okafor','Requested access to #deal-desk-private for Dev Raman from Legal');toast('Request sent to Legal. Dev’s access stays unchanged until they approve.')}render();break;
  case 'release-open':S.modal={type:'release'};render();break;
  case 'modal-close':S.modal=null;render();break;
  case 'release-confirm':
   var kept=S.items.filter(function(i){return i.decision==='keep'}).length,ed=S.items.filter(function(i){return i.edited&&i.decision==='keep'}).length,rm=S.items.filter(function(i){return i.decision==='removed'}).length;
   var real=shareCount(),mk=markerCount(),nn=S.notes.filter(function(n){return n.send}).length;
   S.released=true;S.status='live';S.modal=null;
   L('Maya Okafor','Reviewed '+S.items.length+' items: '+kept+' kept ('+ed+' edited), '+rm+' removed');
   L('Maya Okafor','Released to Dev Raman: '+real+' items, '+mk+' locked marker, '+nn+' notes');
   L('Beacon','Notified Dev Raman'+(nn?' and '+nn+' waiting '+(nn>1?'people':'person'):''));
   S.extra.push({role:'assistant',text:'Released. Dev can open '+real+' items'+(mk?' and sees a locked marker for 1':'')+'. '+nn+' waiting '+(nn===1?'person was':'people were')+' notified. You can revoke access at any time from Handoff.',btn:'View status'});
   S.stick=true;toast('Released to Dev Raman.');render();break;
  case 'reply-send':
   it=findItem(arg);var rp=document.getElementById('rp-'+arg);var rt=rp&&rp.value.trim();
   if(!rt){toast('Write a reply first.');break}
   it.reply=rt;it.devStatus='new';it.flagText='';L('Maya Okafor','Replied to Dev about: '+it.title);toast('Reply sent to Dev.');render();break;
  case 'bell':S.bell=!S.bell;render();break;
  case 'notif':
   S.bell=false;
   if(arg==='dev'){openBrief()}
   else if(arg==='priya'){S.priyaNote=true;S.flags.priyaNote=true;S.ui.priya.screen='chat';L('Priya Nair','Opened the note about the Halvorsen renewal');S.stick=true;render()}
   else{S.ui.maya.screen='detail';render()}
   break;
  case 'open-brief':openBrief();break;
  case 'toggle-access':S.accessOpen=!S.accessOpen;render();break;
  case 'save-copy':
   if(S.savedCopy){toast('Already saved to Content.');break}
   S.savedCopy=true;L('Dev Raman','Saved a dated copy (Nov 10) to Content');toast('Saved a dated copy to your Content. It will not update.');render();break;
  case 'dev-accept':
   it=findItem(arg);it.devStatus='accepted';L('Dev Raman','Accepted item: '+it.title);
   if(shareCount()>0&&acceptedCount()===shareCount()){S.status='closed';L('Beacon','All items accepted. Handoff closed.');toast('Handoff closed. Maya was told.')}
   render();break;
  case 'dev-flag':var pp=arg.split(':');S.modal={type:'flag',kind:pp[0],id:pp[1]};render();break;

   var ft=document.getElementById('flagtext');it=findItem(S.modal.id);

   L('Dev Raman',(S.modal.kind==='flagged'?'Flagged as wrong or stale: ':'Sent back to Maya: ')+it.title);S.modal=null;toast('Sent to Maya.');render();break;
  case 'req-access-dev':it=findItem(arg);it.access=!it.access;if(it.access){L('Dev Raman','Requested access to the restricted source from Legal and Deal Desk');toast('Request sent. Your access does not change until they approve.')}render();break;
  case 'ask-chip':askDev(QS[arg].q);break;
  case 'priya-q':askPriya(PQ[arg]);break;
  case 'src':toast('Opens “'+SRC[arg].l+'” in its source app. Not part of this prototype.');break;

  case 'pause':
   S.paused=!S.paused;L('Noor Haddad',S.paused?'Paused Handoff for everyone':'Turned Handoff back on');toast(S.paused?'Handoff paused for everyone.':'Handoff is on.');render();break;
  case 'revoke-open':S.modal={type:'revoke',from:arg};render();break;
  case 'revoke-confirm':
   S.status='revoked';S.modal=null;L(p==='noor'?'Noor Haddad':'Maya Okafor','Revoked access. Dev Raman and Priya Nair were notified.');toast('Access revoked.');render();break;
 }
